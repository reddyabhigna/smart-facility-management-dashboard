<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Facility Management Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#0A0F1C; --panel:#121A2B; --panel-raised:#17213B; --hairline:#26314A;
    --ink:#E7ECF5; --ink-muted:#8B96AE; --ink-dim:#5B6784;
    --teal:#2FD3B0; --amber:#F5A93F; --red:#F2545B; --indigo:#7C93F7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--canvas);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  ::selection{background:var(--teal);color:var(--canvas);}
  *{scrollbar-color: var(--hairline) var(--panel); scrollbar-width:thin;}
  .mono{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
  .display{font-family:'Space Grotesk',sans-serif;}
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);font-weight:500;}

  #app{display:flex; min-height:100vh;}

  /* Sidebar */
  #sidebar{width:220px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--hairline); padding:20px 12px; position:sticky; top:0; height:100vh; overflow-y:auto;}
  .brand{padding:6px 10px 20px 10px;}
  .brand-title{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; letter-spacing:.01em;}
  .brand-sub{font-size:11px; color:var(--ink-dim); margin-top:2px;}
  .nav-link{display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:6px; font-size:13.5px; color:var(--ink-muted); text-decoration:none; cursor:pointer; transition:background .15s,color .15s; margin-bottom:2px;}
  .nav-link:hover{color:var(--ink); background:var(--panel-raised);}
  .nav-link.active{color:var(--ink); background:var(--panel-raised);}
  .nav-dot{width:6px;height:6px;border-radius:50%;background:var(--ink-dim);flex-shrink:0;}
  .nav-link.active .nav-dot{background:var(--teal); box-shadow:0 0 6px var(--teal);}

  /* Main */
  #main{flex:1; min-width:0;}
  #topbar{position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 28px; background:rgba(10,15,28,0.85); backdrop-filter:blur(6px); border-bottom:1px solid var(--hairline);}
  #topbar h1{font-family:'Space Grotesk',sans-serif; font-size:19px; margin:0; font-weight:600;}
  #topbar .subtitle{font-size:12.5px; color:var(--ink-muted); margin-top:2px;}
  #facility-select{background:var(--panel-raised); color:var(--ink); border:1px solid var(--hairline); border-radius:6px; padding:8px 12px; font-family:'IBM Plex Mono',monospace; font-size:12.5px; cursor:pointer;}
  #facility-select:focus{outline:2px solid var(--indigo); outline-offset:1px;}
  #content{padding:24px 28px 60px 28px;}

  .page{display:none;}
  .page.active{display:block; animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  .grid{display:grid; gap:16px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  @media (max-width:1000px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;}}
  @media (max-width:640px){.grid-4,.grid-3{grid-template-columns:1fr;}}

  .panel{position:relative; background:var(--panel); border:1px solid var(--hairline); border-radius:10px; box-shadow:0 1px 0 0 rgba(255,255,255,0.03) inset, 0 12px 24px -12px rgba(0,0,0,0.5); overflow:hidden;}
  .panel-rail{position:absolute; top:0; left:0; right:0; height:3px;}
  .rail-teal{background:var(--teal);} .rail-amber{background:var(--amber);} .rail-red{background:var(--red);} .rail-indigo{background:var(--indigo);} .rail-dim{background:var(--hairline);}
  .panel-body{padding:18px 18px 16px 18px;}
  .panel-title{font-family:'Space Grotesk',sans-serif; font-size:14px; font-weight:600; margin:0 0 2px 0;}
  .panel-sub{font-size:12px; color:var(--ink-dim); margin-bottom:12px;}

  .kpi-value{font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:600; margin-top:8px; letter-spacing:-.01em;}
  .kpi-delta{font-size:11.5px; margin-top:4px; color:var(--ink-muted);}

  .section-title{font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:600; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.08em; margin:28px 0 12px 0;}
  .section-title:first-child{margin-top:0;}

  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  thead th{text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-dim); font-weight:500; padding:8px 10px; border-bottom:1px solid var(--hairline); position:sticky; top:0; background:var(--panel);}
  tbody td{padding:9px 10px; border-bottom:1px solid rgba(38,49,74,0.5); color:var(--ink); font-family:'IBM Plex Mono',monospace; font-size:12px;}
  tbody td.text-cell{font-family:'Inter',sans-serif; font-size:12.5px;}
  tbody tr:hover{background:var(--panel-raised);}
  .table-scroll{max-height:360px; overflow-y:auto; border-top:1px solid var(--hairline); margin-top:2px;}
  .table-wrap thead th{top:0;}

  .pill{display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:5px; font-size:10.5px; font-weight:600; letter-spacing:.03em; white-space:nowrap;}
  .pill-dot{width:5px;height:5px;border-radius:50%;}
  .pill-teal{background:rgba(47,211,176,0.12); color:var(--teal);} .pill-teal .pill-dot{background:var(--teal);}
  .pill-amber{background:rgba(245,169,63,0.12); color:var(--amber);} .pill-amber .pill-dot{background:var(--amber);}
  .pill-red{background:rgba(242,84,91,0.12); color:var(--red);} .pill-red .pill-dot{background:var(--red);}
  .pill-indigo{background:rgba(124,147,247,0.12); color:var(--indigo);} .pill-indigo .pill-dot{background:var(--indigo);}
  .pill-dim{background:rgba(139,150,174,0.12); color:var(--ink-muted);} .pill-dim .pill-dot{background:var(--ink-muted);}

  .chart-box{position:relative; height:260px;}
  .chart-box.short{height:200px;}

  .filters{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
  select.filter-select{background:var(--panel-raised); color:var(--ink); border:1px solid var(--hairline); border-radius:6px; padding:7px 10px; font-family:'Inter',sans-serif; font-size:12.5px; cursor:pointer;}

  .empty-state{padding:30px; text-align:center; color:var(--ink-dim); font-size:12.5px;}

  a, a:visited{color:inherit;}
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-track{background:var(--panel);}
  ::-webkit-scrollbar-thumb{background:var(--hairline); border-radius:4px;}

  .scope-note{font-size:11px; color:var(--ink-dim); margin-top:2px;}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-title">SMART FACILITY</div>
      <div class="brand-sub">Ops Control Room</div>
    </div>
    <nav id="nav"></nav>
  </aside>
  <div id="main">
    <div id="topbar">
      <div>
        <h1 id="page-title">Overview</h1>
        <div class="subtitle" id="page-subtitle">Portfolio-wide status across all 20 facilities</div>
      </div>
      <select id="facility-select"></select>
    </div>
    <div id="content"></div>
  </div>
</div>

<script>
// ---------- Formatting helpers (mirrors utils/format.js, en-IN, INR) ----------
function fmtNum(n, d=0){ if(n===null||n===undefined||Number.isNaN(n)) return '—'; return Number(n).toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fmtCurrency(n){ if(n===null||n===undefined||Number.isNaN(n)) return '—'; return '₹'+Number(n).toLocaleString('en-IN',{maximumFractionDigits:0}); }
function fmtCompactCurrency(n){ if(n===null||n===undefined||Number.isNaN(n)) return '—'; const abs=Math.abs(n); if(abs>=1e7) return '₹'+(n/1e7).toFixed(2)+'Cr'; if(abs>=1e5) return '₹'+(n/1e5).toFixed(2)+'L'; if(abs>=1e3) return '₹'+(n/1e3).toFixed(1)+'k'; return '₹'+fmtNum(n); }
function fmtDateTime(iso){ if(!iso) return '—'; const d=new Date(iso.replace(' ','T')); return d.toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }

// ---------- Chart theme (mirrors components/ChartTheme.jsx) ----------
// Charts are drawn on <canvas> with plain Canvas 2D — no external chart library,
// so the dashboard has zero runtime network dependency.
const CHART_COLORS = { teal:'#2FD3B0', amber:'#F5A93F', red:'#F2545B', indigo:'#7C93F7', dim:'#5B6784' };
const GRID_COLOR = 'rgba(38,49,74,0.6)';
const INK_MUTED = '#8B96AE';
const INK = '#E7ECF5';

const chartDrawFns = {}; // id -> redraw function, so window resize can re-render every mounted chart
function killChart(id){ delete chartDrawFns[id]; }

function fitCanvas(canvas){
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const w = Math.max(rect.width, 10), h = Math.max(rect.height, 10);
  canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx, w, h};
}

function niceMax(v){
  if(v<=0) return 10;
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  const norm = v/mag;
  let step;
  if(norm<=1) step=1; else if(norm<=2) step=2; else if(norm<=5) step=5; else step=10;
  return step*mag;
}

function drawLegend(ctx, w, items, y){
  ctx.font = "500 11px 'Inter', sans-serif";
  ctx.textBaseline = 'middle';
  const widths = items.map(it=> 16 + ctx.measureText(it.label).width + 18);
  const total = widths.reduce((a,b)=>a+b,0);
  let x = Math.max(8, (w-total)/2);
  items.forEach((it,i)=>{
    ctx.fillStyle = it.color; ctx.beginPath(); ctx.arc(x+5, y, 4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = INK_MUTED; ctx.fillText(it.label, x+15, y+1);
    x += widths[i];
  });
}

function drawLineChart(id, labels, series){
  chartDrawFns[id] = ()=>{
    const canvas = document.getElementById(id); if(!canvas) return;
    const {ctx,w,h} = fitCanvas(canvas);
    ctx.clearRect(0,0,w,h);
    const hasLegend = series.length>1;
    const padL=46, padR=10, padT=10, padB = (labels.length?22:8) + (hasLegend?20:0);
    const plotW = w-padL-padR, plotH = h-padT-padB;
    const maxV = niceMax(Math.max(1, ...series.flatMap(s=>s.data)));
    const steps = 4;
    ctx.strokeStyle = GRID_COLOR; ctx.lineWidth=1; ctx.font = "11px 'IBM Plex Mono', monospace"; ctx.fillStyle = INK_MUTED; ctx.textBaseline='middle';
    for(let i=0;i<=steps;i++){
      const yy = padT + plotH - (plotH*i/steps);
      ctx.beginPath(); ctx.moveTo(padL,yy); ctx.lineTo(padL+plotW,yy); ctx.stroke();
      ctx.textAlign='right'; ctx.fillText(fmtNum(maxV*i/steps), padL-8, yy);
    }
    const n = labels.length || 1;
    const xAt = i => padL + (n<=1 ? plotW/2 : plotW*i/(n-1));
    // x labels (thin out to avoid overlap)
    ctx.textAlign='center'; ctx.textBaseline='top';
    const maxLabels = Math.max(2, Math.floor(plotW/70));
    const strideL = Math.max(1, Math.ceil(n/maxLabels));
    labels.forEach((lb,i)=>{ if(i%strideL===0 || i===n-1) ctx.fillText(String(lb), xAt(i), padT+plotH+8); });
    // series
    series.forEach(s=>{
      if(s.fill){
        ctx.beginPath();
        s.data.forEach((v,i)=>{ const x=xAt(i), y=padT+plotH-(v/maxV)*plotH; if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
        ctx.lineTo(xAt(s.data.length-1), padT+plotH); ctx.lineTo(xAt(0), padT+plotH); ctx.closePath();
        ctx.fillStyle = s.color+'22'; ctx.fill();
      }
      ctx.beginPath();
      s.data.forEach((v,i)=>{ const x=xAt(i), y=padT+plotH-(v/maxV)*plotH; if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
      ctx.strokeStyle = s.color; ctx.lineWidth=2; ctx.lineJoin='round'; ctx.stroke();
      ctx.fillStyle = s.color;
      s.data.forEach((v,i)=>{ const x=xAt(i), y=padT+plotH-(v/maxV)*plotH; ctx.beginPath(); ctx.arc(x,y,2.5,0,Math.PI*2); ctx.fill(); });
    });
    if(hasLegend) drawLegend(ctx, w, series.map(s=>({label:s.label,color:s.color})), h-10);
  };
  chartDrawFns[id]();
}

function drawBarChart(id, labels, datasets, opts={}){
  chartDrawFns[id] = ()=>{
    const canvas = document.getElementById(id); if(!canvas) return;
    const {ctx,w,h} = fitCanvas(canvas);
    ctx.clearRect(0,0,w,h);
    const horizontal = !!opts.horizontal;
    const hasLegend = datasets.length>1;
    const maxV = niceMax(Math.max(1, ...datasets.flatMap(d=>d.data)));
    ctx.font = `${opts.compact?10:11}px 'Inter', sans-serif`;

    if(horizontal){
      const labelW = Math.min(150, Math.max(70, ...labels.map(l=>ctx.measureText(String(l)).width))+10);
      const padL = labelW+8, padR=44, padT=8, padB = 6+(hasLegend?20:0);
      const plotW = w-padL-padR, plotH = h-padT-padB;
      const groupCount = labels.length, dsCount = datasets.length;
      const groupH = plotH/groupCount;
      const barH = Math.min(20, (groupH*0.7)/dsCount);
      ctx.strokeStyle = GRID_COLOR;
      for(let i=0;i<=4;i++){ const xx = padL+plotW*i/4; ctx.beginPath(); ctx.moveTo(xx,padT); ctx.lineTo(xx,padT+plotH); ctx.stroke(); ctx.fillStyle=INK_MUTED; ctx.textAlign='center'; ctx.textBaseline='top'; ctx.font="10px 'IBM Plex Mono', monospace"; ctx.fillText(fmtNum(maxV*i/4), xx, padT+plotH+4); }
      labels.forEach((lb,gi)=>{
        const groupY = padT + groupH*gi;
        ctx.fillStyle = INK_MUTED; ctx.textAlign='right'; ctx.textBaseline='middle'; ctx.font=`${opts.compact?10:11}px 'Inter', sans-serif`;
        ctx.fillText(truncate(ctx,String(lb),labelW-6), padL-8, groupY+groupH/2);
        datasets.forEach((d,di)=>{
          const val = d.data[gi]||0;
          const bw = (val/maxV)*plotW;
          const by = groupY + groupH/2 - (dsCount*barH)/2 + di*barH + 1;
          ctx.fillStyle = d.color;
          roundRect(ctx, padL, by, Math.max(bw,1), barH-2, 3, false);
        });
      });
      if(hasLegend) drawLegend(ctx, w, datasets.map(d=>({label:d.label,color:d.color})), h-10);
    } else {
      const padL=44, padR=10, padT=10, padB=(labels.length?24:8)+(hasLegend?20:0);
      const plotW=w-padL-padR, plotH=h-padT-padB;
      ctx.strokeStyle=GRID_COLOR;
      for(let i=0;i<=4;i++){ const yy=padT+plotH-(plotH*i/4); ctx.beginPath(); ctx.moveTo(padL,yy); ctx.lineTo(padL+plotW,yy); ctx.stroke(); ctx.fillStyle=INK_MUTED; ctx.textAlign='right'; ctx.textBaseline='middle'; ctx.font="11px 'IBM Plex Mono', monospace"; ctx.fillText(fmtNum(maxV*i/4), padL-8, yy); }
      const groupCount = labels.length, dsCount=datasets.length;
      const groupW = plotW/Math.max(groupCount,1);
      const barW = Math.min(28, (groupW*0.65)/dsCount);
      labels.forEach((lb,gi)=>{
        const groupX = padL + groupW*gi;
        ctx.fillStyle=INK_MUTED; ctx.textAlign='center'; ctx.textBaseline='top'; ctx.font=`${opts.compact?10:11}px 'Inter', sans-serif`;
        ctx.fillText(truncate(ctx,String(lb),groupW), groupX+groupW/2, padT+plotH+6);
        datasets.forEach((d,di)=>{
          const val = d.data[gi]||0;
          const bh = (val/maxV)*plotH;
          const bx = groupX+groupW/2 - (dsCount*barW)/2 + di*barW + 1;
          ctx.fillStyle = d.color;
          roundRect(ctx, bx, padT+plotH-bh, Math.max(barW-2,1), bh, 3, true);
        });
      });
      if(hasLegend) drawLegend(ctx, w, datasets.map(d=>({label:d.label,color:d.color})), h-10);
    }
  };
  chartDrawFns[id]();
}

function drawStackedBarChart(id, labels, datasets){
  chartDrawFns[id] = ()=>{
    const canvas = document.getElementById(id); if(!canvas) return;
    const {ctx,w,h} = fitCanvas(canvas);
    ctx.clearRect(0,0,w,h);
    const totals = labels.map((_,gi)=> datasets.reduce((a,d)=>a+(d.data[gi]||0),0));
    const maxV = niceMax(Math.max(1, ...totals));
    const padL=36, padR=10, padT=10, padB=24+20;
    const plotW=w-padL-padR, plotH=h-padT-padB;
    ctx.strokeStyle=GRID_COLOR;
    for(let i=0;i<=4;i++){ const yy=padT+plotH-(plotH*i/4); ctx.beginPath(); ctx.moveTo(padL,yy); ctx.lineTo(padL+plotW,yy); ctx.stroke(); ctx.fillStyle=INK_MUTED; ctx.textAlign='right'; ctx.textBaseline='middle'; ctx.font="10px 'IBM Plex Mono', monospace"; ctx.fillText(fmtNum(maxV*i/4), padL-6, yy); }
    const groupW = plotW/Math.max(labels.length,1);
    const barW = Math.min(40, groupW*0.55);
    labels.forEach((lb,gi)=>{
      const groupX = padL+groupW*gi;
      let base=0;
      datasets.forEach(d=>{
        const val = d.data[gi]||0; if(val<=0) return;
        const bh = (val/maxV)*plotH;
        ctx.fillStyle = d.color;
        ctx.fillRect(groupX+groupW/2-barW/2, padT+plotH-base-bh, barW, bh);
        base += bh;
      });
      ctx.fillStyle=INK_MUTED; ctx.textAlign='center'; ctx.textBaseline='top'; ctx.font="11px 'Inter', sans-serif";
      ctx.fillText(truncate(ctx,String(lb),groupW), groupX+groupW/2, padT+plotH+6);
    });
    drawLegend(ctx, w, datasets.map(d=>({label:d.label,color:d.color})), h-10);
  };
  chartDrawFns[id]();
}

function drawDoughnutChart(id, labels, data, colors){
  chartDrawFns[id] = ()=>{
    const canvas = document.getElementById(id); if(!canvas) return;
    const {ctx,w,h} = fitCanvas(canvas);
    ctx.clearRect(0,0,w,h);
    const legendH = 34;
    const cx=w/2, cy=(h-legendH)/2+4, r=Math.min(cx,cy)-8;
    const total = data.reduce((a,b)=>a+b,0) || 1;
    let start=-Math.PI/2;
    data.forEach((v,i)=>{
      const angle = (v/total)*Math.PI*2;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,start,start+angle); ctx.closePath();
      ctx.fillStyle = colors[i]||CHART_COLORS.dim; ctx.fill();
      start += angle;
    });
    ctx.globalCompositeOperation='destination-out';
    ctx.beginPath(); ctx.arc(cx,cy,r*0.62,0,Math.PI*2); ctx.fill();
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle=INK; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font="600 15px 'IBM Plex Mono', monospace";
    ctx.fillText(fmtNum(total), cx, cy);
    ctx.font = "11px 'Inter', sans-serif"; ctx.textBaseline='middle';
    const items = labels.map((lb,i)=>({label:`${lb} (${data[i]})`, color:colors[i]||CHART_COLORS.dim}));
    drawLegend(ctx, w, items, h-14);
  };
  chartDrawFns[id]();
}

function roundRect(ctx,x,y,w,h,r,vertical){
  if(w<=0||h<=0) return;
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  if(vertical){
    ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
    ctx.lineTo(x+w,y+h); ctx.lineTo(x,y+h); ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
  } else {
    ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r); ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
    ctx.lineTo(x,y+h); ctx.lineTo(x,y);
  }
  ctx.closePath(); ctx.fill();
}
function truncate(ctx, text, maxW){
  if(ctx.measureText(text).width<=maxW) return text;
  let t = text;
  while(t.length>1 && ctx.measureText(t+'…').width>maxW){ t = t.slice(0,-1); }
  return t+'…';
}

window.addEventListener('resize', debounce(()=>{ Object.values(chartDrawFns).forEach(fn=>fn()); }, 150));
function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }

function pillClass(status){
  const s = (status||'').toLowerCase();
  if(['active','completed','closed','resolved','online','normal'].includes(s)) return 'pill-teal';
  if(['pending','medium','open','in progress','caution'].includes(s)) return 'pill-amber';
  if(['inactive','critical','high','under maintenance','failed'].includes(s)) return 'pill-red';
  if(['low','info'].includes(s)) return 'pill-indigo';
  return 'pill-dim';
}
function pill(status){ return `<span class="pill ${pillClass(status)}"><span class="pill-dot"></span>${status ?? '—'}</span>`; }

// ---------- Data store ----------
const facilities = DATA.facilities;
const facilityById = Object.fromEntries(facilities.map(f=>[f.facility_id, f]));
const assetById = Object.fromEntries(DATA.assets.map(a=>[a.asset_id, a]));

const maintenance = DATA.maintenance_records.map(m => ({...m, facility_id: assetById[m.asset_id]?.facility_id }));

let scopeFacilityId = 'ALL'; // current facility scope from topbar selector

function scoped(rows){ return scopeFacilityId==='ALL' ? rows : rows.filter(r=>r.facility_id===scopeFacilityId); }

// ---------- Shared aggregation helpers ----------
function sumBy(rows, key){ return rows.reduce((a,r)=> a + (Number(r[key])||0), 0); }
function groupSum(rows, groupKey, sumKey){
  const m = {};
  for(const r of rows){ const g = r[groupKey] ?? 'Unknown'; m[g] = (m[g]||0) + (Number(r[sumKey])||0); }
  return m;
}
function groupCount(rows, groupKey){
  const m = {};
  for(const r of rows){ const g = r[groupKey] ?? 'Unknown'; m[g] = (m[g]||0) + 1; }
  return m;
}
function avgBy(rows, groupKey, valKey){
  const sum={}, cnt={};
  for(const r of rows){ const g=r[groupKey]; sum[g]=(sum[g]||0)+Number(r[valKey]||0); cnt[g]=(cnt[g]||0)+1; }
  const out={}; for(const g in sum) out[g] = sum[g]/cnt[g];
  return out;
}
function monthSort(m){
  const order = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const [mon,yr] = m.split('-');
  return parseInt(yr)*100 + order.indexOf(mon);
}

// ---------- UI building blocks ----------
function scopeNoteText(){
  return scopeFacilityId==='ALL' ? 'Showing all 20 facilities · portfolio comparisons always show every site' : `Scoped to ${facilityById[scopeFacilityId].facility_name} · portfolio comparisons still show every site for context`;
}
function kpiCard(rail, label, value, sub){
  return `<div class="panel"><div class="panel-rail rail-${rail}"></div><div class="panel-body">
    <div class="eyebrow">${label}</div>
    <div class="kpi-value">${value}</div>
    <div class="kpi-delta">${sub}</div>
  </div></div>`;
}
function panelShell(id, rail, title, sub, kind){
  const boxClass = kind==='chart-short' ? 'chart-box short' : 'chart-box';
  return `<div class="panel"><div class="panel-rail rail-${rail}"></div><div class="panel-body">
    <div class="panel-title">${title}</div>
    ${sub ? `<div class="panel-sub">${sub}</div>` : '<div style="margin-top:10px;"></div>'}
    <div class="${boxClass}"><canvas id="${id}"></canvas></div>
  </div></div>`;
}
function panelTableShell(id, rail, title, sub){
  return `<div class="panel"><div class="panel-rail rail-${rail}"></div><div class="panel-body">
    <div class="panel-title">${title}</div>
    <div class="panel-sub">${sub}</div>
    <div class="table-scroll"><table><thead id="${id}-head"></thead><tbody id="${id}-body"></tbody></table></div>
  </div></div>`;
}
function fillTable(id, cols, rows){
  const head = document.getElementById(id+'-head');
  const body = document.getElementById(id+'-body');
  if(!head || !body) return;
  head.innerHTML = '<tr>'+cols.map(c=>`<th>${c}</th>`).join('')+'</tr>';
  if(rows.length===0){ body.innerHTML = `<tr><td colspan="${cols.length}"><div class="empty-state">No records in the current scope</div></td></tr>`; return; }
  body.innerHTML = rows.map(r=> '<tr>'+r.map(c=>`<td class="${typeof c==='string' && c.length>0 && !c.includes('pill') && isNaN(c) ? 'text-cell':''}">${c}</td>`).join('')+'</tr>').join('');
}

function buildLineChart(id, labels, datasets){ killChart(id); drawLineChart(id, labels, datasets); }
function buildBarChart(id, labels, datasets, opts={}){ killChart(id); drawBarChart(id, labels, datasets, opts); }
function buildStackedBarChart(id, labels, datasets){ killChart(id); drawStackedBarChart(id, labels, datasets); }
function buildDoughnutChart(id, labels, data, colors){ killChart(id); drawDoughnutChart(id, labels, data, colors); }

  renderNav();
  renderFacilitySelect();
  document.getElementById('content').innerHTML = PAGES.map(p=>`<div class="page" id="page-${p.id}"></div>`).join('');
  showPage('overview');
}
boot();
